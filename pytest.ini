[pytest]
# `pytest` trần ở gốc repo phải chạy đúng thứ mà Makefile và `scripts/pre_push_check.sh` chạy (worker/tests).
# `scratch/` chứa probe tay gọi LLM thật và ghi vào DB thật — chúng đã đổi tên thành `probe_*.py` nên không bị gom nữa,
# nhưng hai dòng dưới là hàng rào thứ hai: đặt tên nhầm một lần là một lệnh `pytest` vô hại tiêu tiền API.
# `tests/` là đặc tả/golden của converter Forge cũ và XSD (Java đọc XSD), không phải test để chạy bằng pytest.
testpaths = worker/tests
norecursedirs = scratch tests frontend .venv .venv-carla data src_python_backup
