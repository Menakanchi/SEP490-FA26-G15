services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    # Trong mạng compose, MySQL/Redis có hostname là tên service, không phải
    # localhost như trong .env (dùng khi chạy backend trực tiếp trên máy).
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vehicsim?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-vehicsim}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-vehicsim}
      SPRING_REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    # Healthcheck khai báo trong Dockerfile (curl /health).

  # Schema VehicSim (29 bảng): database/mysql/01_schema.sql chỉ chạy khi volume
  # còn rỗng (lần dựng đầu); thư mục migrations/ bên trong bị entrypoint bỏ qua.
  # DB đã có dữ liệu thì nâng bằng file trong database/mysql/migrations/ — KHÔNG
  # `docker compose down -v` (mất tài khoản và dữ liệu). Đây là database duy nhất.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vehicsim_root}
      MYSQL_DATABASE: vehicsim
      MYSQL_USER: ${MYSQL_USER:-vehicsim}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vehicsim}
    ports:
      - "3306:3306"
    volumes:
      - ./database/mysql:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-vehicsim_root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Mã OTP 6 số (đăng ký / quên mật khẩu), bộ đếm nhập sai và giới hạn tần
  # suất. Không bật lưu xuống đĩa: mọi key đều sống vài phút, mất khi restart
  # chỉ khiến người dùng phải xin mã mới.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
