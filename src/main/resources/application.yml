server:
  port: 8001
  # IP client cho giới hạn đăng nhập / OTP (TD-36). none = lấy địa chỉ kết nối trực tiếp (không đứng sau proxy).
  # Đứng sau reverse proxy / Cloudflare thì đặt native: Tomcat đọc X-Forwarded-For nhưng CHỈ khi kết nối đến từ proxy tin cậy
  # (mặc định các dải IP nội bộ; chỉnh bằng SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES, tên header bằng SERVER_TOMCAT_REMOTEIP_REMOTE_IP_HEADER).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: vehicsim-backend
  # .env của repo (cùng file backend Python từng đọc) nạp thêm khi chạy từ thư mục gốc repo;
  # thiếu file thì bỏ qua. Biến nào không có trong .env dùng giá trị mặc định bên dưới.
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vehicsim?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:vehicsim}
    password: ${SPRING_DATASOURCE_PASSWORD:vehicsim}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true   # không bao giờ gửi mã OTP bằng văn bản thuần
      mail.smtp.connectiontimeout: 15000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true # giữ token sau khi F5 trang Swagger
  paths-to-match: /api/**

# Giữ tên biến và mặc định của backend Python cũ (src_python_backup/config.py).
app:
  env: ${APP_ENV:development}
  auth:
    access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:60}
    otp-ttl-seconds: ${OTP_TTL_SECONDS:600}
    otp-max-attempts: ${OTP_MAX_ATTEMPTS:5}
    otp-resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    otp-requests-per-ip: ${OTP_REQUESTS_PER_IP:5}
    login-attempts-per-ip: ${LOGIN_ATTEMPTS_PER_IP:10}
    login-attempts-per-account: ${LOGIN_ATTEMPTS_PER_ACCOUNT:20}   # chỉ đếm lần đăng nhập SAI vào một email
    register-requests-per-ip: ${REGISTER_REQUESTS_PER_IP:10}
    rate-limit-window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:900}
    registration-mode: ${REGISTRATION_MODE:auto}   # auto (production: otp, còn lại: one_step) | one_step | otp
    smtp-from-email: ${SMTP_FROM_EMAIL:}
  # Origin của frontend được gọi API (CORS). Không dùng "*" vì token đi bằng header Authorization.
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Vòng MVP VehicSim: mô phỏng chạy ở worker/ (Python) qua bundle JSON -> result.json. Tên biến giữ như backend cũ.
vehicsim:
  simulator: ${VEHICSIM_SIMULATOR:kinematic}          # kinematic | carla (carla cần VEHICSIM_CARLA_COMMAND)
  carla-command: ${VEHICSIM_CARLA_COMMAND:}           # JSON list, vd. ["python","worker/run_variant.py","--map","Town05"]
  carla-version: ${VEHICSIM_CARLA_VERSION:0.9.15}
  data-root: ${VEHICSIM_DATA_ROOT:./data/vehicsim}
  run-mode: ${VEHICSIM_RUN_MODE:async}                # async | inline
  simulation-timeout-s: ${SIMULATION_TIMEOUT_S:120}
  run-concurrency: ${VEHICSIM_RUN_CONCURRENCY:4}
  worker-python: ${VEHICSIM_WORKER_PYTHON:python}
  worker-dir: ${VEHICSIM_WORKER_DIR:worker}
  recover-on-startup: ${VEHICSIM_RECOVER_ON_STARTUP:true}
  writes-per-window: ${VEHICSIM_WRITES_PER_WINDOW:30}                  # tạo họ / candidate / regression mỗi người
  max-active-runs-per-user: ${VEHICSIM_MAX_ACTIVE_RUNS_PER_USER:1500}  # run PENDING + RUNNING

# LLM cho bước "Sinh từ mô tả" (DeepSeek / OpenAI, cùng giao thức chat-completions).
llm:
  provider: ${LLM_PROVIDER:openai}
  openai-api-key: ${OPENAI_API_KEY:}
  openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  deepseek-api-key: ${DEEPSEEK_API_KEY:}
  deepseek-base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model-name: ${MODEL_NAME:}
  escalated-model: ${ESCALATED_MODEL:}
  reasoning-effort: ${LLM_REASONING_EFFORT:none}
  temperature: ${LLM_TEMPERATURE:0.7}
  timeout-seconds: 60

jwt:
  # Khoá HMAC dạng Base64 chuẩn. Production bắt buộc đặt JWT_SECRET, nếu không app không khởi động.
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
