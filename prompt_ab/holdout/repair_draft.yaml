# Test cases cho repair_draft node
# 30 cases cover cac loai loi co the sua

test_cases:
  # ============================================
  # NHOM 1: GEOM_NO_CATCHUP (5 cases)
  # ============================================
  - id: 1
    issue_type: "GEOM_NO_CATCHUP"
    invalid_draft:
      title: "Xe may vuot lat"
      odd:
        road_type: "highway"
        weather: "clear"
        actor_type: "motorcycle"
        maneuver: "cut_in"
      time_of_day: "day"
      actors:
        - name: "hero"
          category: "car"
          position: {lane_offset: 0, s_offset_m: 0}
          initial_speed_kmh: 60
          is_ego: true
        - name: "adv"
          category: "motorcycle"
          position: {lane_offset: -1, s_offset_m: 20}
          initial_speed_kmh: 50
          is_ego: false
      maneuvers:
        - actor_name: "adv"
          maneuver: "cut_in"
          trigger: {type: "lead_distance", value: 7}
      duration_s: 30
    issues:
      - code: "GEOM_NO_CATCHUP"
        message_vi: "Khoang cach khong thu hep"
        suggestion: "Dat s_offset_m < 0 va initial_speed > 60"
    expected_fix:
      s_offset_m: < 0
      initial_speed_kmh: "> 60"

