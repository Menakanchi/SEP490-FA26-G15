    user_query: "Xe máy chạy 80 km/h ở làn bên trái, vượt lên từ phía sau ô tô đang chạy 60 km/h, tạt đầu rồi phanh gấp còn 40 km/h."
    odd_cell:
      road_type: "highway"
      weather: "clear"
      actor_type: "motorcycle"
      maneuver: "cut_in"
    expected:
      actors_count: 2
      has_ego: true
      ego_has_maneuver: false
      maneuver_type: "cut_in"
      s_offset_sign: "negative"  # cut_in vượt lên phải ở phía sau
      trigger_type: "lead_distance"

