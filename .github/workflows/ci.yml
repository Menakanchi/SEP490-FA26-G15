name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']   # stacked PR cũng phải qua CI, không chỉ PR nhắm vào main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.2"
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run --locked ruff check src/ tests/

      - name: Check formatting
        run: uv run --locked ruff format --check src/ tests/

      - name: Run tests
        run: >-
          uv run --locked pytest tests/ -v --tb=short
          --cov=src --cov-report=term-missing --cov-fail-under=60
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
